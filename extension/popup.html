<!doctype html>
<html><head><meta charset="utf-8"><title>AI Reading Assistant</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <main>
    <h1>AI Reading Assistant</h1>
    <p>Select text on any page, then right-click → <b>Explain with AI Reading Assistant</b>.</p>
    <label>Explanation language<select id="language"><option value="hi">Hindi + English</option><option value="en">English only</option></select></label>
    <label>Difficulty level<select id="level"><option value="beginner">Beginner</option><option value="intermediate">Intermediate</option><option value="advanced">Advanced</option></select></label>
    <div id="status"></div>
  </main>
  <script src="popup.js"></script>
</body></html>
